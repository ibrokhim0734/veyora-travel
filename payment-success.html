<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment Received — VEYORA TRAVEL</title><style>:root{--n:#062d37;--g:#e3c17a;--ok:#0f7668;--m:#6f7e81}*{box-sizing:border-box}body{margin:0;font:15px Arial;background:#f4f7f6;color:#163138}.wrap{max-width:720px;margin:8vh auto;padding:20px}.card{background:#fff;border-radius:22px;padding:34px;box-shadow:0 14px 45px #0001;text-align:center}.icon{width:72px;height:72px;border-radius:50%;background:#eaf8f3;color:var(--ok);display:grid;place-items:center;margin:auto;font-size:36px;font-weight:900}.muted{color:var(--m)}.status{background:#eef4f2;border-radius:12px;padding:14px;margin:18px 0;text-align:left}a{display:inline-block;background:var(--n);color:#fff;text-decoration:none;padding:13px 20px;border-radius:999px;font-weight:800}.gold{background:var(--g);color:var(--n)}</style></head><body><main class="wrap"><div class="card"><div class="icon">✓</div><h1>Payment Submitted</h1><p class="muted">We are confirming your payment and updating your VEYORA booking.</p><div id="status" class="status">Checking booking status...</div><p><a id="track" class="gold" href="/">Track Booking</a> <a href="/">Home</a></p></div></main><script>(()=>{const $=x=>document.getElementById(x),q=new URLSearchParams(location.search),reference=q.get('reference')||q.get('ref')||'',token=q.get('token')||'';const track=reference&&token?`/track-booking.html?reference=${encodeURIComponent(reference)}&token=${encodeURIComponent(token)}`:'/';$('track').href=track;const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function getStatus(){const r=await fetch('/api/booking-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reference,token})}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Status not available yet');return d.booking||d}function render(b,attempt,done){const p=String(b.payment_status||b.paymentStatus||'processing').replaceAll('_',' '),s=String(b.status||b.booking_status||'processing').replaceAll('_',' '),paid=String(b.payment_status||b.paymentStatus||'')==='paid';$('status').innerHTML=`<b>Booking:</b> ${reference}<br><b>Payment:</b> ${p}<br><b>Booking status:</b> ${s}${!paid&&!done?`<br><br><span class="muted">Confirming payment… check ${attempt}/6</span>`:''}${paid?'<br><br>Payment confirmed. Supplier confirmations and vouchers will appear in Track Booking as they are issued.':done?'<br><br>Payment confirmation is still processing. Track Booking will show the latest status.':''}`;return paid}async function check(){if(!reference||!token){$('status').textContent='Payment was returned successfully. Use your booking confirmation email to track the reservation.';return}let last=null;for(let i=1;i<=6;i++){try{last=await getStatus();if(render(last,i,i===6))return}catch(e){if(i===6){$('status').textContent='Payment return received. Booking confirmation may take a moment; open Track Booking to refresh the latest status.';return}}if(i<6)await sleep(i<3?2000:4000)}if(last)render(last,6,true)}check()})();</script></body></html>
