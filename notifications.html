<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VEYORA Notifications</title><style>:root{--navy:#062d37;--gold:#e3c17a;--line:#dfe7e5;--muted:#6c7b7e;--red:#b42318}*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f4f7f6;color:#163138}.top{background:var(--navy);color:#fff;padding:20px 5vw;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.top a{color:#fff;margin-left:14px}.wrap{max-width:1080px;margin:auto;padding:30px 20px}.card{background:#fff;padding:20px;border-radius:14px;margin-bottom:18px;box-shadow:0 10px 30px rgba(0,0,0,.05)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}input,select,button{font:inherit;padding:11px;border-radius:9px;border:1px solid var(--line);width:100%}button{background:var(--navy);color:#fff;cursor:pointer;font-weight:700}.gold{background:var(--gold);color:var(--navy)}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{background:#eef4f2}.muted{color:var(--muted);font-size:12px}.status{padding:12px;background:#eef4f2;border-radius:9px}.error{color:var(--red);font-weight:700}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef4f2;font-size:10px;font-weight:800;text-transform:uppercase}@media(max-width:760px){.grid{grid-template-columns:1fr}table{min-width:760px}}</style></head><body><div class="top"><strong>VEYORA TRAVEL — CUSTOMER NOTIFICATIONS</strong><div><a href="/admin.html">Admin</a><a href="/operations.html">Operations</a><a href="/fulfillment.html">Fulfillment</a></div></div><div class="wrap"><div class="card"><h2>Send booking update</h2><div id="authMsg" class="status">Checking admin session...</div><div id="form" class="grid" style="margin-top:14px;display:none"><div><label>Booking ID</label><input id="bookingId" type="number" min="1" placeholder="e.g. 123"></div><div><label>Notification type</label><select id="event"><option value="confirmation">Booking confirmed</option><option value="travel_ready">Trip ready</option><option value="documents">Documents ready</option><option value="payment">Payment received</option></select></div><div style="grid-column:1/-1"><button id="send" class="gold">Send / Queue Notification</button></div></div><div id="result" class="status" style="margin-top:14px;display:none"></div></div><div class="card"><h2>Recent bookings</h2><p class="muted">Choose a booking below to prefill the notification form.</p><div style="overflow:auto"><table><thead><tr><th>Booking</th><th>Customer</th><th>Status</th><th>Payment</th><th>Total</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="6">Loading...</td></tr></tbody></table></div></div></div><script>(()=>{const $=id=>document.getElementById(id),token=sessionStorage.getItem('veyora_admin_token')||'',money=n=>'$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2});async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:body?JSON.stringify(body):undefined}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}async function init(){if(!token){$('authMsg').className='status error';$('authMsg').textContent='Please log in from Admin first.';$('rows').innerHTML='<tr><td colspan="6">Admin login required.</td></tr>';return}try{const d=await api('/api/admin-bookings');$('authMsg').textContent='Admin session active.';$('form').style.display='grid';const list=d.bookings||[];$('rows').innerHTML=list.length?list.map(b=>`<tr><td><b>${b.public_reference||('#'+b.id)}</b><br><span class="muted">ID ${b.id}</span></td><td>${b.customer_name||''}<br><span class="muted">${b.email||''}</span></td><td><span class="pill">${b.status||''}</span></td><td><span class="pill">${b.payment_status||''}</span></td><td>${money(b.total_price)}</td><td><button data-id="${b.id}">Select</button></td></tr>`).join(''):'<tr><td colspan="6">No bookings found.</td></tr>';document.querySelectorAll('[data-id]').forEach(btn=>btn.onclick=()=>{$('bookingId').value=btn.dataset.id;window.scrollTo({top:0,behavior:'smooth'})})}catch(e){$('authMsg').className='status error';$('authMsg').textContent=e.message;$('rows').innerHTML='<tr><td colspan="6">Unable to load bookings.</td></tr>'}}$('send').onclick=async()=>{const bookingId=Number($('bookingId').value||0);if(!bookingId)return alert('Booking ID required');$('send').disabled=true;$('send').textContent='Sending...';$('result').style.display='block';$('result').textContent='Processing notification...';try{const d=await api('/api/booking-notification','POST',{bookingId,event:$('event').value});$('result').className='status';$('result').innerHTML=`Booking <b>${d.reference||bookingId}</b>: <b>${d.delivery||'processed'}</b>${d.providerMessageId?`<br>Provider message: ${d.providerMessageId}`:''}${d.trackingUrl?`<br><a href="${d.trackingUrl}" target="_blank">Open customer tracking</a>`:''}`;}catch(e){$('result').className='status error';$('result').textContent=e.message}finally{$('send').disabled=false;$('send').textContent='Send / Queue Notification'}};init()})();</script></body></html>
