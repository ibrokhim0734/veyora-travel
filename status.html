<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VEYORA Booking Status</title><style>:root{--navy:#062d37;--gold:#e3c17a;--green:#0f7668;--line:#dfe7e5;--muted:#6c7b7e;--red:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f6;color:#163138}.top{background:var(--navy);color:#fff;padding:20px 5vw;display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none}.wrap{max-width:900px;margin:auto;padding:40px 20px}.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 12px 35px rgba(0,0,0,.06);margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}input,button{font:inherit}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px}button{border:0;border-radius:999px;padding:12px 18px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer}.secondary{background:var(--gold);color:var(--navy)}.status{padding:12px;border-radius:10px;background:#eef4f2}.error{background:#fff0ef;color:var(--red);font-weight:700}.success{background:#eaf8f3;color:var(--green);font-weight:700}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#eaf8f3;color:var(--green);font-size:12px;font-weight:800}.paypill{display:inline-block;padding:6px 10px;border-radius:999px;background:#fff5df;color:#7a5b13;font-size:12px;font-weight:800}.line{padding:12px 0;border-bottom:1px solid var(--line)}.muted{color:var(--muted);font-size:13px}.paybox{margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:14px;background:#fbfdfc}.payactions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><strong>VEYORA TRAVEL</strong><a href="/">Customer Site</a></div><div class="wrap"><div class="card"><h1>Track Your Trip Request</h1><p class="muted">Use the reference and private tracking token provided after you submit your VEYORA request.</p><div class="grid"><input id="ref" placeholder="Booking reference e.g. VY-2026-ABC12345"><input id="token" placeholder="Private tracking token"></div><br><button id="track">Check Status</button><div id="msg" class="status" style="margin-top:14px">Enter your booking details.</div></div><div id="result" class="card" style="display:none"><span id="statusPill" class="pill">NEW</span> <span id="paymentPill" class="paypill">UNPAID</span><h2 id="title">Booking</h2><div id="body"></div></div></div><script>(()=>{const $=id=>document.getElementById(id),money=n=>'$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});const q=new URLSearchParams(location.search);$('ref').value=q.get('ref')||'';$('token').value=q.get('token')||'';async function load(){const box=$('msg');box.textContent='Loading booking status...';try{const r=await fetch('/api/booking-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reference:$('ref').value.trim(),token:$('token').value.trim()})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to load booking');const b=d.booking;$('result').style.display='block';$('statusPill').textContent=String(b.status||'new').replaceAll('_',' ').toUpperCase();$('paymentPill').textContent=String(b.payment_status||'unpaid').replaceAll('_',' ').toUpperCase();$('paymentPill').className=String(b.payment_status||'unpaid')==='paid'?'pill':'paypill';$('title').textContent=`${b.public_reference} — ${b.departure_city}`;const route=[b.departure_city,...(b.cities_json||[]).map(c=>c.city||c.cityCode||c.airport||'')].filter(Boolean).join(' → '),total=Number(b.total_price||0),paid=Number(b.amount_paid||0),balance=Math.max(0,total-paid),deposit=Math.max(0,Math.round(total*.25*100)/100);const events=(d.events||[]).map(e=>`<div class="line"><b>${String(e.event_type||'').replaceAll('_',' ')}</b><br><span class="muted">${new Date(e.created_at).toLocaleString()}</span></div>`).join('');const pe=(d.paymentEvents||[]).map(e=>`<div class="line"><b>${String(e.event_type||'').replaceAll('_',' ')}</b><br><span class="muted">${e.provider||'Payment'} • ${money(e.amount||0)} ${e.currency||'USD'} • ${new Date(e.created_at).toLocaleString()}</span></div>`).join('');const pay=balance>0?`<div class="paybox"><h3 style="margin-top:0">Payment</h3><div>25% deposit: <b>${money(Math.min(deposit,balance))}</b><br>Remaining balance: <b>${money(balance)}</b></div><div class="payactions"><button disabled title="Enabled after Stripe test validation">Pay 25% Deposit</button><button class="secondary" disabled title="Enabled after Stripe test validation">Pay Full Balance</button></div><p class="muted">Secure Stripe Checkout is prepared. Payment buttons remain disabled until the payment flow is validated in Stripe test mode, so no accidental live charge can occur.</p></div>`:'';$('body').innerHTML=`<div class="line"><b>Route:</b> ${route}</div><div class="line"><b>Departure:</b> ${b.departure_date||'-'}<br><b>Travelers:</b> ${b.travelers}</div><div class="line"><b>Package total:</b> ${money(total)} ${b.currency||'USD'}<br><b>Amount paid:</b> ${money(paid)} ${b.currency||'USD'}<br><b>Balance:</b> ${money(balance)} ${b.currency||'USD'}<br><b>Payment status:</b> ${String(b.payment_status||'unpaid').replaceAll('_',' ')}${b.payment_type?`<br><b>Payment type:</b> ${b.payment_type}`:''}${b.payment_provider?`<br><b>Payment provider:</b> ${b.payment_provider}`:''}</div>${pay}<div class="line"><b>Provider:</b> ${b.provider_name||'VEYORA'}<br><b>Inventory:</b> ${(b.supplier_mode||'demo').toUpperCase()}</div><h3>Trip Updates</h3>${events||'<div class="line">No updates yet.</div>'}<h3>Payment Updates</h3>${pe||'<div class="line">No payment activity yet.</div>'}`;box.className='status success';box.textContent='Booking loaded.'}catch(e){$('result').style.display='none';box.className='status error';box.textContent=e.message}}$('track').onclick=load;if($('ref').value&&$('token').value)load();})();</script></body></html>
