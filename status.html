<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VEYORA Booking Status</title><style>:root{--n:#062d37;--g:#e3c17a;--green:#0f7668;--line:#dfe7e5;--m:#6c7b7e;--red:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7f6;color:#163138}.top{background:var(--n);color:#fff;padding:20px 5vw;display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none}.wrap{max-width:950px;margin:auto;padding:40px 20px}.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 12px 35px #0000000f;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}input,button{font:inherit}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px}button,.btn{display:inline-block;border:0;border-radius:999px;padding:12px 18px;background:var(--n);color:#fff;font-weight:700;cursor:pointer;text-decoration:none}.secondary{background:var(--g);color:var(--n)}.danger{background:#fff;color:var(--red);border:1px solid #efc7c3}.status{padding:12px;border-radius:10px;background:#eef4f2}.error{background:#fff0ef;color:var(--red);font-weight:700}.success{background:#eaf8f3;color:var(--green);font-weight:700}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#eaf8f3;color:var(--green);font-size:12px;font-weight:800}.paypill,.pending{display:inline-block;padding:6px 10px;border-radius:999px;background:#fff5df;color:#7a5b13;font-size:12px;font-weight:800}.bad{background:#fff0ef;color:var(--red)}.line{padding:12px 0;border-bottom:1px solid var(--line)}.muted{color:var(--m);font-size:13px}.box{margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:14px;background:#fbfdfc}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.component{border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0}.component-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.component h4{margin:7px 0}.component-meta{line-height:1.6}.type{font-size:10px;letter-spacing:.08em;color:var(--m);font-weight:800;text-transform:uppercase}@media(max-width:650px){.grid{grid-template-columns:1fr}.component-head{display:block}.component-head .pill{margin-top:8px}}</style></head><body><div class="top"><strong>VEYORA TRAVEL</strong><a href="/">Customer Site</a></div><div class="wrap"><div class="card"><h1>Track Your Trip</h1><p class="muted">Use your VEYORA reference and private tracking token.</p><div class="grid"><input id="ref" placeholder="Booking reference"><input id="token" placeholder="Private tracking token"></div><br><button id="track">Check Status</button><div id="msg" class="status" style="margin-top:14px">Enter your booking details.</div></div><div id="result" class="card" style="display:none"><span id="statusPill" class="pill">NEW</span> <span id="paymentPill" class="paypill">UNPAID</span><h2 id="title"></h2><div id="body"></div></div></div><script>(()=>{const $=id=>document.getElementById(id),money=n=>'$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});const q=new URLSearchParams(location.search);$('ref').value=q.get('ref')||'';$('token').value=q.get('token')||'';const sc=s=>['confirmed','ticketed'].includes(s)?'pill':['cancelled','failed'].includes(s)?'pill bad':'pending';async function pay(type){const box=$('msg');try{box.className='status';box.textContent='Opening secure checkout...';const r=await fetch('/api/create-payment-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reference:$('ref').value.trim(),token:$('token').value.trim(),paymentType:type})});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to start payment');location.href=d.url}catch(e){box.className='status error';box.textContent=e.message}}async function load(){const box=$('msg');box.textContent='Loading booking status...';try{const r=await fetch('/api/booking-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reference:$('ref').value.trim(),token:$('token').value.trim()})}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load booking');const b=d.booking;$('result').style.display='block';$('statusPill').textContent=String(b.status||'new').replaceAll('_',' ').toUpperCase();$('paymentPill').textContent=String(b.payment_status||'unpaid').replaceAll('_',' ').toUpperCase();$('paymentPill').className=String(b.payment_status||'unpaid')==='paid'?'pill':'paypill';$('title').textContent=`${b.public_reference} — ${b.departure_city}`;const total=Number(b.total_price||0),paid=Number(b.amount_paid||0),balance=Math.max(0,total-paid),deposit=Math.round(total*.25*100)/100,route=[b.departure_city,...(b.cities_json||[]).map(c=>c.city||c.cityCode||c.airport||'')].filter(Boolean).join(' → ');const components=(d.components||[]).map(c=>`<div class="component"><div class="component-head"><div><div class="type">${String(c.item_type||'service').replaceAll('_',' ')}</div><h4>${c.title||'Travel service'}</h4></div><span class="${sc(String(c.status||''))}">${String(c.status||'pending').replaceAll('_',' ').toUpperCase()}</span></div><div class="component-meta muted">${c.description||''}${c.supplier?`<br>Supplier: ${c.supplier}`:''}${c.confirmation_code?`<br><b>Confirmation:</b> ${c.confirmation_code}`:''}${c.ticket_number?`<br><b>Ticket:</b> ${c.ticket_number}`:''}${Number(c.total_price||0)>0?`<br>Price: ${money(c.total_price)} ${c.currency||'USD'}`:''}</div>${c.voucher_url?`<div class="actions"><a class="btn" href="${c.voucher_url}" target="_blank" rel="noopener">Open Ticket / Voucher</a></div>`:''}</div>`).join('');const pe=(d.paymentEvents||[]).map(e=>`<div class="line"><b>${String(e.event_type||'').replaceAll('_',' ')}</b><br><span class="muted">${e.provider||'Payment'} • ${money(e.amount||0)} ${e.currency||'USD'} • ${new Date(e.created_at).toLocaleString()}</span></div>`).join('');const ce=(d.cancellationRequests||[]).map(e=>`<div class="line"><b>${String(e.status||'requested').replaceAll('_',' ')}</b><br><span class="muted">${new Date(e.requested_at).toLocaleString()}</span>${e.admin_notes?`<br>${e.admin_notes}`:''}</div>`).join('');const paybox=balance>0?`<div class="box"><h3>Secure Payment</h3><div>25% deposit: <b>${money(Math.min(deposit,balance))}</b><br>Remaining balance: <b>${money(balance)}</b></div><div class="actions"><button id="payDeposit">Pay 25% Deposit</button><button id="payFull" class="secondary">Pay Full Balance</button></div><p class="muted">Stripe Hosted Checkout opens in a secure payment page. Available wallets such as Apple Pay or Google Pay may appear when eligible.</p></div>`:'';const docs=`<div class="box"><h3>Travel Documents</h3><div><b>Package voucher:</b> ${String(b.voucher_status||'not_ready').replaceAll('_',' ')}</div><div class="actions">${b.voucher_url?`<a class="btn" href="${b.voucher_url}" target="_blank">Open Package Voucher</a>`:''}${b.invoice_url?`<a class="btn secondary" href="${b.invoice_url}" target="_blank">Open Invoice</a>`:''}</div>${!b.voucher_url&&!b.invoice_url?'<p class="muted">Package documents will appear after confirmation.</p>':''}</div>`;const cancelState=String(b.cancellation_status||'none'),cancel=`<div class="box"><h3>Cancellation / Refund</h3><div><b>Cancellation:</b> ${cancelState.replaceAll('_',' ')}<br><b>Refund:</b> ${String(b.refund_status||'none').replaceAll('_',' ')}${Number(b.refund_amount||0)>0?`<br><b>Refund amount:</b> ${money(b.refund_amount)}`:''}</div>${cancelState==='none'&&b.status!=='cancelled'?`<div class="actions"><a class="btn danger" href="/cancellation.html?ref=${encodeURIComponent(b.public_reference)}&token=${encodeURIComponent($('token').value.trim())}">Request Cancellation</a></div>`:''}${ce?`<h4>Cancellation Updates</h4>${ce}`:''}</div>`;$('body').innerHTML=`<div class="line"><b>Route:</b> ${route}</div><div class="line"><b>Departure:</b> ${b.departure_date||'-'}<br><b>Travelers:</b> ${b.travelers}</div><div class="line"><b>Trip total:</b> ${money(total)} ${b.currency||'USD'}<br><b>Paid:</b> ${money(paid)}<br><b>Balance:</b> ${money(balance)}</div><div class="box"><h3>Your Travel Services</h3>${components||'<p class="muted">Detailed service confirmations will appear here.</p>'}</div>${paybox}${docs}${cancel}<div class="line"><b>Provider:</b> ${b.provider_name||'VEYORA'}<br><b>Inventory:</b> ${(b.supplier_mode||'demo').toUpperCase()}</div><h3>Payment Updates</h3>${pe||'<div class="line">No payment activity yet.</div>'}`;if($('payDeposit'))$('payDeposit').onclick=()=>pay('deposit');if($('payFull'))$('payFull').onclick=()=>pay('full');box.className='status success';box.textContent=q.get('payment')==='success'?'Payment submitted. Status will update after Stripe confirmation.':'Booking loaded.'}catch(e){$('result').style.display='none';box.className='status error';box.textContent=e.message}}$('track').onclick=load;if($('ref').value&&$('token').value)load();})();</script></body></html>
