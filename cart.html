<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Trip — VEYORA TRAVEL</title><style>:root{--n:#062d37;--g:#e3c17a;--l:#dce5e3;--m:#6f7e81;--green:#0f7668}*{box-sizing:border-box}body{margin:0;font:15px Arial;color:#163138;background:#f4f7f6}a{text-decoration:none;color:inherit}.top{background:var(--n);color:#fff;padding:18px 5vw;display:flex;justify-content:space-between}.wrap{max-width:1100px;margin:auto;padding:40px 20px}.layout{display:grid;grid-template-columns:1fr 350px;gap:18px}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 10px 30px #0000000b;margin-bottom:14px}.item{display:grid;grid-template-columns:90px 1fr auto;gap:15px;padding:17px 0;border-bottom:1px solid var(--l)}.type{background:#eef4f2;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;text-transform:uppercase;font-size:11px}.muted{color:var(--m)}button,.btn{border:0;border-radius:999px;background:var(--n);color:#fff;padding:12px 17px;font-weight:800;cursor:pointer}.remove{background:#fff;color:#8b2d25;border:1px solid #ead7d4;padding:8px 11px}.total{font-size:38px;font-weight:800}.gold{background:var(--g);color:var(--n);display:block;text-align:center;margin-top:10px;width:100%}.empty{text-align:center;padding:50px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff5df;color:#7a5b13;font-size:11px;font-weight:800}.pill.live{background:#eaf8f3;color:var(--green)}.status{margin-top:12px;padding:12px;border-radius:12px;background:#f2f5f4;line-height:1.5}.ok{background:#eaf8f3;color:var(--green)}.warn{background:#fff5df;color:#7a5b13}.disabled{opacity:.45;pointer-events:none}@media(max-width:750px){.layout{grid-template-columns:1fr}.item{grid-template-columns:70px 1fr}}</style></head><body><header class="top"><b>VEYORA TRAVEL — MY TRIP</b><a href="/search.html">+ Add Travel</a></header><main class="wrap"><div class="layout"><section><div class="card"><h1>Your Trip Cart</h1><p class="muted">Flights, hotels, transfers, rail and experiences in one itinerary.</p><div id="items"></div></div></section><aside><div class="card"><span id="inventory" class="pill">NOT CHECKED</span><h3>Trip Summary</h3><p>Subtotal <b id="subtotal" style="float:right">$0.00</b></p><p>Fees <b id="fees" style="float:right">$0.00</b></p><hr style="border:0;border-top:1px solid var(--l)"><div class="muted">Total</div><div id="total" class="total">$0.00</div><button id="preflight" class="gold">Check Availability & Price</button><button id="checkout" class="gold disabled">Secure Checkout</button><div id="checkStatus" class="status">Check supplier readiness before checkout.</div></div></aside></div></main><script>(()=>{const $=id=>document.getElementById(id),money=n=>'$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});let token=localStorage.getItem('veyora_cart_token')||'';async function api(method='GET',body){const r=await fetch('/api/trip-cart'+(token?'?token='+encodeURIComponent(token):''),{method,headers:{'Content-Type':'application/json'},body:method==='GET'?undefined:JSON.stringify(body||{})}),d=await r.json();if(!r.ok)throw Error(d.error||'Cart error');return d}async function ensure(){if(token)return;const d=await api('POST',{action:'create'});token=d.cart.cart_token;localStorage.setItem('veyora_cart_token',token)}async function load(){await ensure();const d=await api(),items=d.items||[];$('subtotal').textContent=money(d.cart.subtotal);$('fees').textContent=money(d.cart.fees);$('total').textContent=money(d.cart.total);$('inventory').textContent=(d.cart.inventory_status||'unchecked').replaceAll('_',' ').toUpperCase();$('inventory').className='pill '+(d.cart.inventory_status==='live'?'live':'');$('items').innerHTML=items.length?items.map(x=>`<div class="item"><div class="type">${x.item_type}</div><div><b>${x.title}</b><div class="muted">${x.description||''}</div><div>${x.supplier||''} • ${money(x.total_price)} ${x.currency}</div><span class="pill ${x.inventory_mode==='live'?'live':''}">${(x.inventory_mode||'demo').toUpperCase()}</span></div><button class="remove" data-id="${x.id}">Remove</button></div>`).join(''):`<div class="empty">Cart is empty.<br><br><a class="btn" href="/search.html">Search Travel</a></div>`;document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{await api('POST',{action:'remove',id:+b.dataset.id});$('checkout').classList.add('disabled');load()})}$('preflight').onclick=async()=>{const box=$('checkStatus');try{$('preflight').disabled=true;box.textContent='Rechecking connected supplier inventory and current price...';const r=await fetch('/api/cart-preflight',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})}),d=await r.json();if(!r.ok)throw Error(d.error||'Availability check failed');$('inventory').textContent=d.inventoryStatus.replaceAll('_',' ').toUpperCase();$('inventory').className='pill '+(d.checkoutReady?'live':'');if(d.checkoutReady){box.className='status ok';box.textContent='Availability and supplier readiness passed. Continue to secure checkout.';$('checkout').classList.remove('disabled')}else{box.className='status warn';box.textContent=`${d.requiresSupplierConfirmation.length} service(s) still require LIVE supplier confirmation.`;$('checkout').classList.add('disabled')}}catch(e){box.className='status warn';box.textContent=e.message}finally{$('preflight').disabled=false}};$('checkout').onclick=()=>{if(!$('checkout').classList.contains('disabled'))location.href='/checkout.html'};load().catch(e=>$('items').innerHTML='<div class="empty">'+e.message+'</div>')})();</script></body></html>
