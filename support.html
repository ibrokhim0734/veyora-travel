<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VEYORA Support Inbox</title><style>:root{--navy:#062d37;--gold:#e3c17a;--line:#dfe7e5;--green:#0f7668;--red:#b42318}body{margin:0;font:14px Arial;background:#f4f7f6;color:#163138}.top{background:var(--navy);color:white;padding:20px 5%;display:flex;justify-content:space-between}.top a{color:white}.wrap{max-width:1200px;margin:auto;padding:30px 20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi,.card{background:white;border-radius:14px;padding:18px;margin-bottom:18px}.kpi strong{font-size:28px;display:block;margin-top:5px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#eef4f2}select,textarea,button{font:inherit;padding:9px;border-radius:8px;border:1px solid var(--line)}textarea{width:100%;box-sizing:border-box}button{background:var(--navy);color:white;font-weight:700;cursor:pointer}.msg{max-width:420px;white-space:pre-wrap}.status{padding:10px;background:#eef4f2;border-radius:8px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}table{min-width:1000px}}</style></head><body><div class="top"><strong>VEYORA SUPPORT</strong><div><a href="/admin.html">Admin</a> &nbsp; <a href="/operations.html">Operations</a></div></div><div class="wrap"><div class="grid"><div class="kpi">Total<strong id="kTotal">0</strong></div><div class="kpi">New<strong id="kNew">0</strong></div><div class="kpi">In Progress<strong id="kProgress">0</strong></div><div class="kpi">Resolved<strong id="kResolved">0</strong></div></div><div class="card"><h2>Customer Messages</h2><div id="state" class="status">Loading...</div><div style="overflow:auto;margin-top:15px"><table><thead><tr><th>Received</th><th>Customer</th><th>Booking</th><th>Message</th><th>Status / Notes</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script>(()=>{const token=sessionStorage.getItem('veyora_admin_token')||'', $=id=>document.getElementById(id);if(!token){$('state').textContent='Admin login required. Open Admin, log in, then return here.';return}async function api(method='GET',body){const r=await fetch('/api/admin-support',{method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}async function load(){try{const d=await api();$('kTotal').textContent=d.summary.total;$('kNew').textContent=d.summary.new;$('kProgress').textContent=d.summary.inProgress;$('kResolved').textContent=d.summary.resolved;$('rows').innerHTML=(d.messages||[]).map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td><b>${x.full_name}</b><br>${x.email}<br>${x.phone||''}</td><td>${x.booking_reference||'-'}</td><td class="msg">${esc(x.message)}</td><td><select id="s${x.id}">${['new','in_progress','resolved','spam'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select><br><textarea id="n${x.id}" rows="3" placeholder="Internal note">${esc(x.admin_notes||'')}</textarea><br><button data-save="${x.id}">Save</button></td></tr>`).join('');document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const id=+b.dataset.save;b.disabled=true;try{await api('PATCH',{id,status:$('s'+id).value,adminNotes:$('n'+id).value});await load()}catch(e){alert(e.message)}finally{b.disabled=false}});$('state').textContent='Support inbox loaded.'}catch(e){$('state').textContent=e.message}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load()})();</script></body></html>
