<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VEYORA TRAVEL — Travel Beyond Ordinary</title>
<style>
:root{--navy:#062d37;--gold:#e3c17a;--ink:#163138;--muted:#6f7e81;--green:#0f7668;--red:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--ink);background:#f7faf9}header{background:var(--navy);color:#fff;padding:18px 5vw;display:flex;justify-content:space-between;align-items:center}.logo{font-family:Georgia,serif;letter-spacing:.18em;font-size:24px}.hero{min-height:420px;padding:80px 5vw;color:#fff;background:linear-gradient(90deg,rgba(6,45,55,.82),rgba(6,45,55,.25)),url('https://images.unsplash.com/photo-1533105079780-92b9be482077?auto=format&fit=crop&w=1800&q=85') center/cover}.hero h1{font-family:Georgia,serif;font-size:60px;margin:0 0 15px}.wrap{max-width:1150px;margin:-50px auto 60px;padding:0 20px}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 15px 50px rgba(0,0,0,.09);margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:12px;border:1px solid #dce4e2;border-radius:10px}button{border:0;border-radius:999px;padding:12px 18px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.total{font-size:38px;font-weight:800;color:var(--green)}.muted{color:var(--muted);font-size:13px}.status{margin-top:14px;padding:12px;border-radius:10px;background:#f1f5f4}.status.success{background:#eaf8f3;color:var(--green);font-weight:700}.status.error{background:#fff0ef;color:var(--red);font-weight:700}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero h1{font-size:44px}}
</style></head>
<body>
<header><div class="logo">VEYORA TRAVEL</div><a href="/admin.html" style="color:white">Admin</a></header>
<section class="hero"><h1>Travel Beyond Ordinary.</h1><p>Build your own multi-city journey and see your estimated package price.</p></section>
<div class="wrap">
<div class="card"><h2>Build Your Journey</h2><div class="grid">
<input id="departureCity" value="New York (JFK)" placeholder="Departure city"><input id="departureDate" type="date"><input id="customerName" placeholder="Full name"><input id="email" type="email" placeholder="Email"><input id="phone" placeholder="Phone / WhatsApp"><select id="travelers"><option>1</option><option selected>2</option><option>3</option><option>4</option></select><select id="flightClass"><option value="economy">Economy</option><option value="premium">Premium Economy</option><option value="business">Business</option><option value="none">No flights</option></select><select id="hotelLevel"><option value="4star">4★ Premium</option><option value="5star">5★ Luxury</option><option value="boutique">Boutique</option><option value="ultra">Ultra Luxury</option></select>
</div></div>
<div class="card"><h3>Destinations</h3><div class="grid"><input id="city1" value="Rome, Italy"><input id="nights1" type="number" value="3" min="1"><input id="city2" value="Lucerne, Switzerland"><input id="nights2" type="number" value="3" min="1"><input id="city3" value="Paris, France"><input id="nights3" type="number" value="3" min="1"></div></div>
<div class="card"><h3>Extras</h3><label><input type="checkbox" class="extra" value="airport"> Private airport transfers</label><br><label><input type="checkbox" class="extra" value="rail"> Intercity rail / ground</label><br><label><input type="checkbox" class="extra" value="citytour"> Private city highlights</label><br><label><input type="checkbox" class="extra" value="concierge"> VEYORA concierge</label></div>
<div class="card"><button id="calcBtn" type="button">Calculate Package Price</button><div class="total" id="total">$0</div><div class="muted" id="breakdown">Choose your options, then calculate.</div></div>
<div class="card"><textarea id="notes" rows="4" placeholder="Special requests"></textarea><br><br><button id="submitBtn" type="button">Submit Booking Request</button><div id="statusBox" class="status">Ready to send your request.</div></div>
</div>
<script>
(()=>{
 const U='https://neckklsrofckomgmbcjg.supabase.co';
 const $=id=>document.getElementById(id);
 let latestQuote=null;
 const getCities=()=>[1,2,3].map(i=>({city:$('city'+i).value.trim(),nights:Number($('nights'+i).value)||1})).filter(x=>x.city);
 const getExtras=()=>Array.from(document.querySelectorAll('.extra:checked')).map(x=>x.value);
 function quote(){const t=Number($('travelers').value)||1,n=getCities().reduce((s,c)=>s+c.nights,0),fp={economy:780,premium:1290,business:3450,none:0}[$('flightClass').value],hp={'4star':190,'5star':340,boutique:285,ultra:720}[$('hotelLevel').value],ex={airport:220,rail:260,citytour:180,concierge:240};const flight=fp*t,hotel=hp*n*t,extras=getExtras().reduce((s,k)=>s+(ex[k]||0)*t,0),subtotal=flight+hotel+extras,markup=subtotal*.12+95,total=subtotal+markup;return{breakdown:{flight,hotel,extras,markup,total},perPerson:total/t};}
 function renderQuote(){latestQuote=quote();$('total').textContent='$'+Math.round(latestQuote.breakdown.total).toLocaleString();$('breakdown').textContent=`Flights $${Math.round(latestQuote.breakdown.flight).toLocaleString()} • Hotels $${Math.round(latestQuote.breakdown.hotel).toLocaleString()} • Extras $${Math.round(latestQuote.breakdown.extras).toLocaleString()} • VEYORA fee/markup $${Math.round(latestQuote.breakdown.markup).toLocaleString()} • $${Math.round(latestQuote.perPerson).toLocaleString()} per person`;}
 $('calcBtn').addEventListener('click',renderQuote);
 $('submitBtn').addEventListener('click',async()=>{
   const btn=$('submitBtn'),box=$('statusBox');
   const name=$('customerName').value.trim(),email=$('email').value.trim(),departure=$('departureCity').value.trim(),cities=getCities();
   if(!name||!email||!departure||!cities.length){box.className='status error';box.textContent='Please enter name, email, departure city and at least one destination.';return;}
   renderQuote(); btn.disabled=true; btn.textContent='Sending...'; box.className='status'; box.textContent='Sending booking request to VEYORA...';
   try{
     const r=await fetch(U+'/functions/v1/submit-booking',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customerName:name,email,phone:$('phone').value.trim(),departureCity:departure,departureDate:$('departureDate').value||null,travelers:Number($('travelers').value)||1,cities,flightClass:$('flightClass').value,hotelLevel:$('hotelLevel').value,extras:getExtras(),notes:$('notes').value})});
     const d=await r.json().catch(()=>({error:'Server returned an unreadable response'}));
     if(!r.ok) throw new Error(d.error||`Request failed (${r.status})`);
     if(d.price){$('total').textContent='$'+Math.round(d.price.total).toLocaleString();$('breakdown').textContent=`Server-confirmed estimate • $${Math.round(d.price.perPerson).toLocaleString()} per person`;}
     box.className='status success';box.textContent=`Success! Booking request #${d.booking.id} was sent to VEYORA Admin.`;
   }catch(e){box.className='status error';box.textContent='Could not send request: '+e.message;}
   finally{btn.disabled=false;btn.textContent='Submit Booking Request';}
 });
 renderQuote();
})();
</script></body></html>
