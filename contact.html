<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact — VEYORA TRAVEL</title><style>body{margin:0;font:16px Arial;color:#163138;background:#f5f8f7}.top{padding:20px 6%;background:#062d37;color:white;display:flex;justify-content:space-between}.top a{color:white;text-decoration:none}.wrap{max-width:900px;margin:auto;padding:60px 20px}.card{background:white;padding:30px;border-radius:20px;box-shadow:0 12px 35px #0000000d}h1{font:48px Georgia}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}input,textarea{font:inherit;width:100%;box-sizing:border-box;padding:13px;border:1px solid #dfe7e5;border-radius:10px}button{margin-top:14px;border:0;border-radius:999px;background:#062d37;color:white;padding:13px 20px;font-weight:bold}.muted{color:#6c7b7e;line-height:1.6}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><b>VEYORA TRAVEL</b><a href="/">Home</a></div><main class="wrap"><div class="card"><h1>Talk to VEYORA</h1><p class="muted">Need help planning a journey or with an existing request? Send us a message. For an existing booking, include your VEYORA reference.</p><div class="grid"><input id="name" placeholder="Full name"><input id="email" type="email" placeholder="Email"></div><div class="grid" style="margin-top:14px"><input id="ref" placeholder="Booking reference (optional)"><input id="phone" placeholder="Phone / WhatsApp (optional)"></div><textarea id="message" rows="7" placeholder="How can we help?" style="margin-top:14px"></textarea><button id="send">Prepare Message</button><p id="msg" class="muted">Customer-support email delivery will be connected to VEYORA's verified support mailbox.</p></div></main><script>document.getElementById('send').onclick=()=>{const n=document.getElementById('name').value.trim(),e=document.getElementById('email').value.trim(),m=document.getElementById('message').value.trim();document.getElementById('msg').textContent=n&&e&&m?'Message details are ready. VEYORA support email delivery is being connected; no message has been sent yet.':'Please enter your name, email and message.'}</script></body></html>
