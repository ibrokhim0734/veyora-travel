<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact — VEYORA TRAVEL</title><style>body{margin:0;font:16px Arial;color:#163138;background:#f5f8f7}.top{padding:20px 6%;background:#062d37;color:white;display:flex;justify-content:space-between}.top a{color:white;text-decoration:none}.wrap{max-width:900px;margin:auto;padding:60px 20px}.card{background:white;padding:30px;border-radius:20px;box-shadow:0 12px 35px #0000000d}h1{font:48px Georgia}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}input,textarea{font:inherit;width:100%;box-sizing:border-box;padding:13px;border:1px solid #dfe7e5;border-radius:10px}button{margin-top:14px;border:0;border-radius:999px;background:#062d37;color:white;padding:13px 20px;font-weight:bold;cursor:pointer}.muted{color:#6c7b7e;line-height:1.6}.ok{color:#0f7668;font-weight:700}.err{color:#b42318;font-weight:700}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><b>VEYORA TRAVEL</b><div><a href="/faq.html" style="margin-right:18px">FAQ</a><a href="/">Home</a></div></div><main class="wrap"><div class="card"><h1>Talk to VEYORA</h1><p class="muted">Need help planning a journey or with an existing request? Send us a message. For an existing booking, include your VEYORA reference.</p><div class="grid"><input id="name" placeholder="Full name"><input id="email" type="email" placeholder="Email"></div><div class="grid" style="margin-top:14px"><input id="ref" placeholder="Booking reference (optional)"><input id="phone" placeholder="Phone / WhatsApp (optional)"></div><textarea id="message" rows="7" placeholder="How can we help?" style="margin-top:14px"></textarea><button id="send">Send Message</button><p id="msg" class="muted">Your message will be saved securely in VEYORA Support.</p></div></main><script>document.getElementById('send').onclick=async()=>{const btn=document.getElementById('send'),box=document.getElementById('msg');try{const payload={fullName:document.getElementById('name').value.trim(),email:document.getElementById('email').value.trim(),bookingReference:document.getElementById('ref').value.trim(),phone:document.getElementById('phone').value.trim(),message:document.getElementById('message').value.trim()};btn.disabled=true;btn.textContent='Sending...';box.className='muted';box.textContent='Sending your message to VEYORA Support...';const r=await fetch('/api/contact-message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to send message');box.className='ok';box.textContent='Message received. Support reference: '+d.reference+'.';document.getElementById('message').value='';}catch(e){box.className='err';box.textContent=e.message}finally{btn.disabled=false;btn.textContent='Send Message'}};</script></body></html>
