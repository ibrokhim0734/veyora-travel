name: Booking safety tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test booking guards with mocked suppliers and notifications
        run: node --test tests/*.test.mjs tests/*.test.cjs
