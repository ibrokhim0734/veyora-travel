<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search Travel — VEYORA TRAVEL</title><style>:root{--n:#062d37;--g:#e3c17a;--bg:#f4f7f6;--l:#dce5e3;--m:#6f7e81;--green:#0f7668}*{box-sizing:border-box}body{margin:0;font:15px Arial;color:#163138;background:var(--bg)}a{text-decoration:none;color:inherit}.top{background:var(--n);color:#fff;padding:18px 5vw;display:flex;justify-content:space-between;align-items:center}.logo{font:22px Georgia;letter-spacing:.15em}.toplinks{display:flex;gap:16px}.wrap{max-width:1180px;margin:auto;padding:35px 20px}.tabs{display:flex;gap:7px;overflow:auto}.tab{border:0;padding:13px 18px;border-radius:999px;background:#fff;font-weight:800;white-space:nowrap;cursor:pointer}.tab.active{background:var(--g);color:var(--n)}.card{background:#fff;border-radius:20px;padding:25px;box-shadow:0 12px 35px #0000000b;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}label span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--m);font-weight:800;margin-bottom:6px}input,select{width:100%;padding:13px;border:1px solid var(--l);border-radius:10px;font:inherit}.search,.add{background:var(--n);color:#fff;border:0;border-radius:999px;padding:14px 22px;font-weight:800;margin-top:18px;cursor:pointer}.add{margin:0;padding:10px 15px}.hint{color:var(--m);line-height:1.6}.badge{display:inline-block;background:#eaf8f3;color:var(--green);padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.results{display:none}.results.show{display:block}.result{display:grid;grid-template-columns:1fr auto;gap:18px;padding:20px 0;border-bottom:1px solid var(--l)}.price{font-size:25px;font-weight:800;text-align:right}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.filter{padding:8px 12px;border:1px solid var(--l);background:#fff;border-radius:999px}.cartnotice{position:fixed;right:20px;bottom:20px;background:var(--n);color:#fff;padding:14px 18px;border-radius:14px;display:none;box-shadow:0 12px 35px #0003}.cartnotice.show{display:block}.demo{background:#fff5df;color:#7a5b13}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.grid{grid-template-columns:1fr}.result{grid-template-columns:1fr}.price{text-align:left}}</style></head><body><header class="top"><a class="logo" href="/">VEYORA TRAVEL</a><div class="toplinks"><a href="/cart.html">My Trip</a><a href="/status.html">Track Booking</a></div></header><main class="wrap"><span class="badge">VEYORA TRAVEL ENGINE</span><h1>Search, compare, add to one journey.</h1><p class="hint">Flights, hotels, transfers and experiences can be booked separately or combined inside one VEYORA trip cart.</p><div class="tabs"><button class="tab active" data-type="packages">Packages</button><button class="tab" data-type="flights">Flights</button><button class="tab" data-type="hotels">Hotels</button><button class="tab" data-type="transfers">Transfers</button><button class="tab" data-type="experiences">Experiences</button></div><section class="card"><h2 id="title"></h2><p id="desc" class="hint"></p><div id="form"></div></section><section id="results" class="card results"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><span id="mode" class="badge demo">DEMO INVENTORY</span><h2>Search Results</h2></div><a href="/cart.html"><b>View My Trip →</b></a></div><div class="filters"><button class="filter">Best</button><button class="filter">Lowest price</button><button class="filter">Recommended</button></div><div id="resultList"></div></section></main><div id="notice" class="cartnotice">Added to My Trip ✓</div><script>(()=>{const $=id=>document.getElementById(id),money=n=>'$'+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});let type='packages',cartToken=localStorage.getItem('veyora_cart_token')||'';const templates={packages:{t:'Build a Dynamic Package',d:'Combine several cities and services into one package.',h:`<div class="grid"><label><span>From</span><input value="JFK"></label><label><span>First destination</span><input value="FCO"></label><label><span>Departure</span><input type="date"></label><label><span>Travelers</span><select><option>1</option><option selected>2</option><option>3</option></select></label></div><button class="search" data-package>Open Full Package Builder</button>`},flights:{t:'Search Flights',d:'Compare flight options and add the selected fare to My Trip.',h:`<div class="grid"><label><span>From</span><input id="from" value="JFK"></label><label><span>To</span><input id="to" value="LHR"></label><label><span>Departure</span><input id="date" type="date"></label><label><span>Passengers</span><select id="pax"><option>1</option><option selected>2</option><option>3</option></select></label></div><button class="search" data-search>Search Flights</button>`},hotels:{t:'Search Hotels',d:'Compare hotel options and add a room offer to My Trip.',h:`<div class="grid"><label><span>Destination</span><input id="city" value="Paris"></label><label><span>Check-in</span><input id="in" type="date"></label><label><span>Check-out</span><input id="out" type="date"></label><label><span>Guests</span><select id="guests"><option>1</option><option selected>2</option><option>3</option></select></label></div><button class="search" data-search>Search Hotels</button>`},transfers:{t:'Search Transfers',d:'Add airport, hotel or point-to-point ground transport to My Trip.',h:`<div class="grid"><label><span>Pickup</span><input id="pickup" value="DXB Airport"></label><label><span>Drop-off</span><input id="drop" value="Dubai Marina"></label><label><span>Date & time</span><input id="when" type="datetime-local"></label><label><span>Passengers</span><select id="pax"><option>1</option><option selected>2</option><option>3</option></select></label></div><button class="search" data-search>Search Transfers</button>`},experiences:{t:'Search Experiences',d:'Add attractions, tours and activities to My Trip.',h:`<div class="grid"><label><span>Destination</span><input id="city" value="Rome"></label><label><span>Date</span><input id="date" type="date"></label><label><span>Travelers</span><select id="pax"><option>1</option><option selected>2</option><option>3</option></select></label><label><span>Category</span><select id="category"><option>All</option><option>City tours</option><option>Attractions</option></select></label></div><button class="search" data-search>Search Experiences</button>`}};function show(k){type=k;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.type===k));$('title').textContent=templates[k].t;$('desc').textContent=templates[k].d;$('form').innerHTML=templates[k].h;$('results').classList.remove('show');const p=document.querySelector('[data-package]');if(p)p.onclick=()=>location.href='/#planner';const s=document.querySelector('[data-search]');if(s)s.onclick=search}function val(id){return document.getElementById(id)?.value||''}function search(){let rows=[];if(type==='flights'){const a=val('from').toUpperCase(),b=val('to').toUpperCase(),d=val('date')||'Selected date',p=+val('pax')||1;rows=[{item_type:'flight',title:`${a} → ${b} • Economy`,description:`${d} • Nonstop • 1 checked bag`,supplier:'Demo Air',unit_price:620*p},{item_type:'flight',title:`${a} → ${b} • Economy Flex`,description:`${d} • 1 stop • Flexible fare`,supplier:'Demo Airways',unit_price:548*p},{item_type:'flight',title:`${a} → ${b} • Premium Economy`,description:`${d} • Nonstop • Premium seat`,supplier:'Demo Atlantic',unit_price:940*p}]}else if(type==='hotels'){const c=val('city'),i=val('in'),o=val('out');rows=[{item_type:'hotel',title:`Grand ${c} Hotel • 5★`,description:`${i} → ${o} • Breakfast • Free cancellation`,supplier:'Demo Beds',unit_price:980},{item_type:'hotel',title:`${c} Boutique Collection • 4★`,description:`${i} → ${o} • Central location`,supplier:'Demo Hotels',unit_price:690},{item_type:'hotel',title:`Luxury Stay ${c} • 5★`,description:`${i} → ${o} • Premium room`,supplier:'Demo Luxury',unit_price:1240}]}else if(type==='transfers'){const a=val('pickup'),b=val('drop');rows=[{item_type:'transfer',title:`Private Sedan • ${a} → ${b}`,description:'Meet & greet • Up to 3 passengers',supplier:'Demo Transfer',unit_price:85},{item_type:'transfer',title:`Premium SUV • ${a} → ${b}`,description:'Meet & greet • Premium vehicle',supplier:'Demo Transfer',unit_price:135}]}else{const c=val('city');rows=[{item_type:'experience',title:`Highlights of ${c}`,description:'Small-group guided city experience',supplier:'Demo Experiences',unit_price:89},{item_type:'experience',title:`Private ${c} Discovery`,description:'Private guide • Flexible itinerary',supplier:'Demo Experiences',unit_price:220}]}render(rows)}function render(rows){$('results').classList.add('show');$('resultList').innerHTML=rows.map((r,i)=>`<div class="result"><div><span class="badge">${r.item_type.toUpperCase()}</span><h3>${r.title}</h3><div class="hint">${r.description}</div><div class="hint">Supplier: ${r.supplier}</div></div><div><div class="price">${money(r.unit_price)}</div><button class="add" data-add="${i}">Add to My Trip</button></div></div>`).join('');document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(rows[+b.dataset.add]))}async function cartApi(body){let r;if(!cartToken){r=await fetch('/api/trip-cart',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'create'})});let d=await r.json();if(!r.ok)throw Error(d.error||'Could not create cart');cartToken=d.cart.cart_token;localStorage.setItem('veyora_cart_token',cartToken)}r=await fetch('/api/trip-cart?token='+encodeURIComponent(cartToken),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not update cart');return d}async function add(r){try{await cartApi({action:'add',item:{...r,quantity:1,currency:'USD',offer_json:{mode:'demo',source:'search.html'}}});$('notice').classList.add('show');setTimeout(()=>$('notice').classList.remove('show'),1800)}catch(e){alert(e.message)}}document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>show(x.dataset.type));show('packages')})();</script></body></html>
