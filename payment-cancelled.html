<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment Not Completed — VEYORA TRAVEL</title><style>:root{--n:#062d37;--g:#e3c17a;--m:#6f7e81}*{box-sizing:border-box}body{margin:0;font:15px Arial;background:#f4f7f6;color:#163138}.wrap{max-width:720px;margin:8vh auto;padding:20px}.card{background:#fff;border-radius:22px;padding:34px;box-shadow:0 14px 45px #0001;text-align:center}.muted{color:var(--m)}.status{background:#fff5df;border-radius:12px;padding:14px;margin:18px 0}a{display:inline-block;background:var(--n);color:#fff;text-decoration:none;padding:13px 20px;border-radius:999px;font-weight:800}.gold{background:var(--g);color:var(--n)}</style></head><body><main class="wrap"><div class="card"><h1>Payment Not Completed</h1><p class="muted">No successful payment confirmation was received on this return page.</p><div class="status">Your booking can still be tracked. You can return to the booking page and retry payment if the booking remains payable.</div><p><a id="track" class="gold" href="/">Track Booking</a> <a href="/checkout.html">Return to Checkout</a></p></div></main><script>const q=new URLSearchParams(location.search),r=q.get('reference')||q.get('ref')||'',t=q.get('token')||'';if(r&&t)document.getElementById('track').href=`/track-booking.html?reference=${encodeURIComponent(r)}&token=${encodeURIComponent(t)}`;</script></body></html>
