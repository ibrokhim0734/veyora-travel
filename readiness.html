<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VEYORA Readiness</title><style>:root{--n:#062d37;--g:#e3c17a;--ok:#0f7668;--bad:#b42318;--line:#dfe7e5;--m:#6c7b7e}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f6;color:#163138}.top{background:var(--n);color:#fff;padding:20px 5vw;display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none}.wrap{max-width:1100px;margin:auto;padding:35px 20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 10px 30px #0000000c}.pill{display:inline-block;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:800;background:#eef4f2}.ok{background:#eaf8f3;color:var(--ok)}.bad{background:#fff0ef;color:var(--bad)}.warn{background:#fff5df;color:#7a5b13}.muted{color:var(--m);font-size:13px}.big{font-size:26px;font-weight:800}.row{padding:12px 0;border-bottom:1px solid var(--line)}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><strong>VEYORA TRAVEL — PRODUCTION READINESS</strong><a href="/">Customer Site</a></div><div class="wrap"><div id="overall" class="card"><div class="muted">Checking system status...</div></div><br><div id="grid" class="grid"></div><br><div class="card"><h3>Missing Production Configuration</h3><div id="missing" class="muted">Loading...</div></div></div><script>(()=>{const cls=v=>v?'pill ok':'pill bad',yn=v=>v?'READY':'NOT READY';async function load(){const overall=document.getElementById('overall'),grid=document.getElementById('grid'),missing=document.getElementById('missing');try{const r=await fetch('/api/provider-status'),d=await r.json();if(!r.ok)throw Error(d.error||'Status unavailable');const rd=d.readiness||{};overall.innerHTML=`<span class="${cls(rd.productionReady)}">${yn(rd.productionReady)}</span><h1>VEYORA Production Status</h1><div class="big">${rd.productionReady?'Production integrations are ready':'Some production integrations still need configuration'}</div><p class="muted">Last checked ${new Date(d.timestamp).toLocaleString()}</p>`;const cards=[['Flight Search',d.flights?.configured,`${d.flights?.provider||'Amadeus'} • ${d.flights?.environment||''}`],['Hotel Search',d.hotels?.configured,`${d.hotels?.provider||'Amadeus Hotels'} • ${d.hotels?.environment||''}`],['Booking Backend',d.bookingBackend?.reachable,`HTTP ${d.bookingBackend?.status??'unreachable'}`],['Payment Backend',d.paymentBackend?.reachable,`HTTP ${d.paymentBackend?.status??'unreachable'}`],['Tracking Backend',d.trackingBackend?.reachable,`HTTP ${d.trackingBackend?.status??'unreachable'}`],['Auto Fulfillment',rd.automaticFulfillmentReady,`Flight ${d.supplierBookingAdapters?.flight?'✓':'✕'} • Hotel ${d.supplierBookingAdapters?.hotel?'✓':'✕'} • Transfer ${d.supplierBookingAdapters?.transfer?'✓':'✕'}`]];grid.innerHTML=cards.map(x=>`<div class="card"><span class="${cls(x[1])}">${yn(x[1])}</span><h3>${x[0]}</h3><div class="muted">${x[2]}</div></div>`).join('');missing.innerHTML=(rd.missing||[]).length?(rd.missing||[]).map(x=>`<div class="row">${x}</div>`).join(''):'No missing production variables detected.'}catch(e){overall.innerHTML=`<span class="pill bad">ERROR</span><h1>Readiness check failed</h1><p>${e.message}</p>`;missing.textContent='Unable to load system status.'}}load()})();</script></body></html>
